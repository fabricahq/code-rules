name: Syllabus
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Download and verify Syllabus, then add it to PATH.
      - name: Install Syllabus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=SYLLABUS_VERSION
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          archive="syllabus_${version}_linux_amd64.tar.gz"
          dir="$RUNNER_TEMP/syllabus"
          mkdir -p "$dir" && cd "$dir"
          gh release download "v$version" --repo fabricahq/code-rules \
            --pattern SHA256SUMS --pattern "$archive"
          gh attestation verify SHA256SUMS --repo fabricahq/code-rules \
            --signer-workflow fabricahq/code-rules/.github/workflows/release-planner.yml \
            --source-ref refs/heads/main
          checksum=$(sha256sum "$archive")
          grep -qxF "$checksum" SHA256SUMS
          tar -xzf "$archive" syllabus
          installed="Installed Syllabus $("$dir/syllabus" --version)."
          echo "$installed" && echo "$installed" >> "$GITHUB_STEP_SUMMARY"
          echo "$dir" >> "$GITHUB_PATH"
      - run: syllabus library check
