name: Publish CLI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-cli
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository checks compare against the pinned TypeScript reference.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - name: Check release identity and declared tool license
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: bun _tools/release-check.ts
      - run: bun run check
      - name: Pack the release artifact
        run: npm pack
      - name: Test the exact tarball to be published
        run: CODE_RULES_TARBALL="$(find "$PWD" -maxdepth 1 -name '*.tgz' -print -quit)" bun run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
      - name: Publish the tested tarball with npm trusted publishing
        run: |
          artifact=$(find "$PWD" -maxdepth 1 -name '*.tgz' -print -quit)
          tag=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          npm publish "$artifact" --access public --provenance --tag "$tag"
