# Announce downloadable candidates without executing code or reading artifact contents from the PR.
name: Comment binary preview
on:
  workflow_run:
    workflows: [Package CLI binaries]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
concurrency:
  group: binary-preview-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Link the completed binary preview on its pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/package-binaries.yml' ||
                run.event !== 'pull_request' || run.conclusion !== 'success') return;
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, per_page: 100,
            });
            const candidates = artifacts.filter(a =>
              a.name === 'unpublished-native-candidates' && !a.expired && a.size_in_bytes > 0);
            if (candidates.length !== 1) {
              core.warning('No unique, unexpired binary preview found; no comment posted.');
              return;
            }
            const artifact = candidates[0];
            // Query GitHub directly: workflow_run.pull_requests can be empty for fork PRs.
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha, per_page: 100,
            });
            const marker = '<!-- code-rules-binary-preview -->';
            const runURL = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;
            const downloadURL = `${runURL}/artifacts/${artifact.id}`;
            const commitURL = `${context.serverUrl}/${owner}/${repo}/commit/${run.head_sha}`;
            const expires = new Date(artifact.expires_at).toLocaleString('en-US', {
              timeZone: 'UTC', dateStyle: 'medium', timeStyle: 'short',
            });
            for (const candidate of pulls) {
              if (candidate.base.repo.id !== context.payload.repository.id) continue;
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: candidate.number});
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const previous = comments.find(c =>
                c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
              // An older completion must not replace a newer run or rerun's download link.
              const stamp = previous?.body.match(/<!-- run:(\d+) attempt:(\d+) -->/);
              if (stamp && (Number(stamp[1]) > run.id ||
                  (Number(stamp[1]) === run.id && Number(stamp[2]) > run.run_attempt))) continue;
              const body = [
                marker,
                `<!-- run:${run.id} attempt:${run.run_attempt} -->`,
                '### CLI preview ready',
                '',
                `A test build for [\`${run.head_sha.slice(0, 7)}\`](${commitURL}) is ready. Packaging and installation checks passed.`,
                '',
                `[Download for macOS or Linux](${downloadURL}) · [Build and test results](${runURL})`,
                '',
                '**Manual testing is optional.** To try this PR, unzip the download, extract the archive for your computer, and run `./code-rules --help` from the extracted folder. No installation needed.',
                '',
                `Includes Intel/AMD and ARM builds. GitHub sign-in required. Download expires ${expires} UTC.`,
                '',
                'This preview is for testing this PR and has not been released.',
              ].join('\n');
              if (previous) {
                await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
              } else {
                await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});
              }
            }
